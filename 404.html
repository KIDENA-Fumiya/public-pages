<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Public Pages moved</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { display: grid; min-height: 100vh; margin: 0; place-items: center; }
    main { max-width: 36rem; padding: 2rem; text-align: center; }
    a { color: inherit; }
  </style>
  <script>
    (function () {
      var base = "https://fumiya-kidena.github.io/public-pages";
      var suffix = location.pathname.replace(/^\/public-pages(?=\/|$)/, "");
      var target = base + suffix + location.search + location.hash;
      window.PUBLIC_PAGES_TARGET = target;
      location.replace(target);
    }());
  </script>
</head>
<body>
  <main>
    <h1>Public Pages moved</h1>
    <p>新しいURLへ移動します。</p>
    <p><a id="destination" href="https://fumiya-kidena.github.io/public-pages/">移動しない場合はこちら</a></p>
  </main>
  <script>
    document.getElementById("destination").href = window.PUBLIC_PAGES_TARGET;
  </script>
</body>
</html>
